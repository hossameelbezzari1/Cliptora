
services:
  mysql:
    image: mysql:8.4
    container_name: cliptora-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cliptora-local-db}
      MYSQL_DATABASE: cliptora_v2

    ports:
      - "127.0.0.1:3307:3306"

    volumes:
      - cliptora_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: deployment/backend/Dockerfile

    image: cliptora-backend:local
    container_name: cliptora-backend
    restart: unless-stopped

    environment:
      ENVIRONMENT: development

      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-cliptora-local-db}@mysql:3306/cliptora_v2?charset=utf8mb4
      SECRET_KEY: ${CLIPTORA_SECRET_KEY:-cliptora-local-session-secret-change-me}

      SESSION_DAYS: 14
      MAX_UPLOAD_MB: 250

      STORAGE_DIR: /workspace/storage

      FRONTEND_ORIGIN: http://localhost:5173

      WORKFLOW_QUEUE: local
      CLIPTORA_WORKFLOW_ROOT: /workspace/storage/workflows
      CLIPTORA_WORKFLOW_MAX_UPLOAD_MB: ${CLIPTORA_WORKFLOW_MAX_UPLOAD_MB:-4096}
      CLIPTORA_WORKFLOW_HTTP_ALLOWED_HOSTS: ${CLIPTORA_WORKFLOW_HTTP_ALLOWED_HOSTS:-}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLIPTORA_OPENAI_MODEL: ${CLIPTORA_OPENAI_MODEL:-gpt-4o-mini}

      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CLIPTORA_OLLAMA_ALLOWED_HOSTS: ${CLIPTORA_OLLAMA_ALLOWED_HOSTS:-}

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./storage:/workspace/storage

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 30

  frontend:
    build:
      context: .
      dockerfile: deployment/frontend/Dockerfile

    image: cliptora-frontend:local
    container_name: cliptora-frontend
    restart: unless-stopped

    environment:
      BACKEND_URL: http://backend:8000

    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
      - --port
      - "5173"
      - --strictPort

    ports:
      - "5173:5173"

    depends_on:
      backend:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: cliptora-phpmyadmin
    restart: unless-stopped

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

    ports:
      - "8081:80"

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  cliptora_mysql_data:
